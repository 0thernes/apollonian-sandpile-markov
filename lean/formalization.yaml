  # lake comparator --paranoid checks the 17 targets in comparator.json.
ai_assistance_disclosure:
  statement: "AI systems assisted with code drafting, Lean tactic engineering, LaTeX formatting, and test automation under human direction. The Lean statements are checked by the Lean kernel and replayed by the additional kernels listed above (coverage as noted); the finite data are recomputed in Rust, ISO C11 and Python. Most statements formalize known results; see CLAIMS.md."
