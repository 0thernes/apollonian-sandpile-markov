title = "apollonian-sandpile-markov gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow deterministic SHA-256 checksum manifests and ORCID identifiers"
paths = [
  '''MANIFEST\.sha256''',
  '''SHA256SUMS''',
  '''results/exact_verification_report\.json''',
]
