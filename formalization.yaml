version: "v0.4"
release_version: "3.0.0"

project:
  name: "Thin Vieta Reflection Groups, Apollonian-Octahedral Obstructions, Lattice Sandpile Identities, and Markov-Hurwitz Spectra"
  description: >-
    Self-contained, zero-Mathlib Lean 4.35.0 formalization of 16 headline statements
    (T1a-T3e plus T2f), constructive non-vacuity witnesses, and 10 false-variant and
    hypothesis-necessity refutations (19 exported audited declarations; 884 declarations
    exhaustively axiom-audited via VerifyAllDecls.lean strictly within [propext,
    Classical.choice, Quot.sound]). Covers Eisenstein (1844) quadratic reciprocity,
    HKRS (2024) Apollonian square obstructions on three roots via parabolic Dehn-twist
    CRT, octahedral mod-8 locking, the general d-dimensional Soddy-Gosset integrality
    dichotomy (LMW 2002), universal Abelian sandpile confluence and finite termination on
    every sinked dissipative graph via a constructive superharmonic potential (Dhar 1990),
    direct 4x4 and 9x9 Z^2 and A_2 Laplace determinants and Dhar traces, an elementary A_2
    even-Laplacian parity lemma, Markov's classical descent theorem and Ying Zhang's (2007)
    mod-32 theorem for all positive Markov solutions, 5-step Markov quiver exchange
    identities, and Hurwitz's (1907) complete n=4 Vieta-orbit classification.
  authors:
    - "Alexander Stephen Donahue (ORCID: 0009-0006-8168-9648)"
  responsible_maintainers:
    - "Alexander Stephen Donahue (@0thernes, 0_0@0thernes.art, ORCID: 0009-0006-8168-9648)"
  license: "Apache-2.0"

