status:
  scope: >-
    16 headline statements (T1a-T3e plus T2f), master conjunction, constructive non-vacuity
    witnesses, and 10 adversarial refutations in zero-Mathlib Lean 4.35.0 (884 declarations
    audited via VerifyAllDecls.lean). Explicitly does NOT solve NT-083 (Markov uniqueness),
    STAT-058 (continuum sandpile PDE limit), full Apollonian local-global classification,
    global octahedral reciprocity, Matrix-Tree theorem, Kalinin-Shkolnikov convergence,
    all-depth Lee-Schiffler positivity, or Hurwitz n >= 5 asymptotics.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "ApollonianSandpileMarkov.Palomar.prove_all_apollonian_sandpile_markov_theorems"
      file: "lean/PalomarSolution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "lean/comparator.json"

fidelity:
  divergences: >-
    All statement boundaries and divergences from motivating open problems are audited line
    by line in docs/statement-fidelity.md, CLAIMS.md, LIMITATIONS.md, and ERRATA.md.
    Specifically: T1c covers three HKRS roots; T1d proves mod-8 locking on one octahedral
    orbit plus 5 closed Jacobi checks (not global octahedral reciprocity); T2b and T2f prove
    direct 4x4 and 9x9 Laplace determinants and legal Dhar traces (no Matrix-Tree theorem);
    T2c covers one isotropic Z^2 obstruction; T2e proves edge-normal closure (not the
    Kalinin-Shkolnikov theorem); and T3d proves a 5-step symbolic cluster sequence.

