      framework: "Antigravity"
      notes: >-
        Assisted with zero-Mathlib Lean 4.35.0 tactic engineering, Rust/C11/Python differential
        oracles, AMS-LaTeX typesetting, and CI automation under continuous human direction.
  notes: >-
    Every theorem is verified independently without trusting any AI system across six formal
    type-checking kernels in CI (lean 4.35.0, leanchecker --fresh, lean4lean, nanoda_bin,
    con-leche, con-ron) plus a live negative tamper-rejection gate.

