# SPDX-License-Identifier: Apache-2.0
[package]
name = "apollonian-sandpile-markov"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Exact zero-dependency Rust computational verifier for Thin Vieta Reflection Groups, Apollonian-Octahedral Reciprocity, Z^2 vs A_2 Sandpiles, and Markov-Hurwitz Spectra"
repository = "https://github.com/0thernes/apollonian-sandpile-markov"

[lib]
name = "asm_core"
path = "src/lib.rs"

[[bin]]
name = "asm-verify"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
